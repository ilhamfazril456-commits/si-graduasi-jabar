<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Protective Shield Border -->
  <path d="M 256 64 L 396 128 C 396 280 256 392 256 424 C 256 392 116 280 116 128 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" opacity="0.3" />

  <!-- Inner Shield -->
  <path d="M 256 84 L 380 142 C 380 274 256 372 256 400 C 256 372 132 274 132 142 Z" 
        fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Graduation Toga Cap / Emblem of Achievement & Social Ascendancy -->
  <polygon points="256,160 348,206 256,252 164,206" fill="url(#emeraldGrad)" />
  <path d="M 204 226 L 204 278 C 204 294 308 294 308 278 L 308 226" fill="none" stroke="#6ee7b7" stroke-width="8" stroke-linecap="round" />
  
  <!-- Tassel -->
  <path d="M 256 206 L 334 238 L 334 286" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
  <circle cx="334" cy="292" r="7" fill="url(#goldGrad)" />

  <!-- Upward Arrow of Economic Independence / Graduation -->
  <path d="M 256 360 L 256 294 M 228 322 L 256 294 L 284 322" 
        fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Text SG Brand Mark -->
  <text x="256" y="470" font-family="Plus Jakarta Sans, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="4">SI-GRADUASI</text>
</svg>
